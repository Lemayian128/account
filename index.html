<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaTrade · Realistic Trading UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0b0e14;
      color: #e9edf5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      letter-spacing: -0.01em;
    }

    /* ============================================================
       AUTH SCREENS (Login / Register)
       ============================================================ */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, #1a2330, #0b0e14 70%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 20px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .auth-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .auth-card {
      background: #131a24;
      border: 1px solid #1f2a37;
      border-radius: 28px;
      width: 100%;
      max-width: 420px;
      padding: 40px 32px 32px 32px;
      box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.03);
      position: relative;
      overflow: hidden;
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 10%, rgba(41, 98, 255, 0.08), transparent 60%);
      pointer-events: none;
    }

    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .auth-logo .logo-icon {
      background: linear-gradient(145deg, #2962ff, #1e4bd8);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: white;
      box-shadow: 0 8px 16px -4px rgba(41, 98, 255, 0.5);
    }

    .auth-logo .logo-text {
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff, #b0c4de);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-title {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      text-align: center;
      font-size: 14px;
      color: #8b9bb0;
      margin-bottom: 28px;
      font-weight: 400;
    }

    .auth-tabs {
      display: flex;
      background: #1a2330;
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .auth-tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #8b9bb0;
      background: transparent;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .auth-tab.active {
      background: #2962ff;
      color: white;
      box-shadow: 0 4px 12px rgba(41, 98, 255, 0.3);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .auth-form .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .auth-form label {
      font-size: 12px;
      color: #8b9bb0;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .auth-form .input-wrapper {
      display: flex;
      align-items: center;
      background: #1a2330;
      border: 1px solid #253141;
      border-radius: 12px;
      padding: 0 14px;
      transition: border 0.15s;
    }

    .auth-form .input-wrapper:focus-within {
      border-color: #2962ff;
      box-shadow: 0 0 0 3px rgba(41, 98, 255, 0.15);
    }

    .auth-form .input-wrapper i {
      color: #6b7b8f;
      font-size: 14px;
      margin-right: 10px;
      width: 16px;
      text-align: center;
    }

    .auth-form input {
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 15px;
      font-weight: 500;
      padding: 14px 0;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }

    .auth-form input::placeholder {
      color: #5e6e82;
      font-weight: 400;
    }

    .auth-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-top: -4px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #8b9bb0;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      appearance: none;
      width: 16px;
      height: 16px;
      background: #1a2330;
      border: 1px solid #253141;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      transition: all 0.15s;
    }

    .checkbox-label input[type="checkbox"]:checked {
      background: #2962ff;
      border-color: #2962ff;
    }

    .checkbox-label input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      color: white;
      font-size: 11px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: 700;
    }

    .forgot-link {
      color: #2962ff;
      text-decoration: none;
      font-weight: 500;
      font-size: 13px;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .auth-submit {
      background: #2962ff;
      border: none;
      color: white;
      font-weight: 600;
      font-size: 15px;
      padding: 16px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
      letter-spacing: -0.01em;
      box-shadow: 0 10px 20px -8px rgba(41, 98, 255, 0.4);
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .auth-submit:hover {
      background: #1e4bd8;
      transform: translateY(-1px);
      box-shadow: 0 14px 24px -8px rgba(41, 98, 255, 0.6);
    }

    .auth-footer {
      text-align: center;
      font-size: 13px;
      color: #6b7b8f;
      margin-top: 20px;
    }

    .auth-footer a {
      color: #2962ff;
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    /* register-only fields */
    .register-only {
      display: none;
    }

    .auth-card.register-mode .register-only {
      display: flex;
    }

    /* ============================================================
       MAIN APP
       ============================================================ */
    .app-container {
      max-width: 1440px;
      width: 100%;
      background: #131a24;
      border-radius: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.03);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .app-container.hidden {
      display: none;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: #0f151e;
      border-bottom: 1px solid #1f2a37;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      background: linear-gradient(145deg, #2962ff, #1e4bd8);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: white;
      box-shadow: 0 6px 12px -4px rgba(41, 98, 255, 0.4);
    }

    .logo-text {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff, #b0c4de);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: #1a2330;
      border-radius: 40px;
      padding: 8px 16px;
      width: 300px;
      border: 1px solid #253141;
    }

    .search-bar i {
      color: #6b7b8f;
      font-size: 14px;
      margin-right: 8px;
    }

    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: #e9edf5;
      font-size: 14px;
      width: 100%;
      font-weight: 400;
    }

    .search-bar input::placeholder {
      color: #5e6e82;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .balance-chip {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1a2330;
      padding: 6px 14px 6px 12px;
      border-radius: 30px;
      border: 1px solid #253141;
    }

    .balance-chip .label {
      font-size: 13px;
      color: #8b9bb0;
      font-weight: 500;
    }

    .balance-chip .amount {
      font-weight: 700;
      color: white;
      font-size: 15px;
    }

    .balance-chip .amount small {
      font-size: 12px;
      font-weight: 500;
      color: #34c77b;
      margin-left: 6px;
    }

    .deposit-btn {
      background: linear-gradient(145deg, #2962ff, #1e4bd8);
      border: none;
      color: white;
      padding: 9px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 12px -4px rgba(41, 98, 255, 0.4);
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .deposit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px -4px rgba(41, 98, 255, 0.6);
    }

    .avatar {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #2b3b4e, #1f2c3a);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #9ab3d1;
      border: 1px solid #31465e;
      font-size: 15px;
      cursor: pointer;
      position: relative;
    }

    .avatar::after {
      content: '';
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 10px;
      height: 10px;
      background: #34c77b;
      border-radius: 50%;
      border: 2px solid #0f151e;
    }

    /* Main Grid */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 16px;
      padding: 16px 20px 20px 20px;
      background: #0b0e14;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chart-card, .positions-card, .order-card, .watchlist-card {
      background: #131a24;
      border-radius: 20px;
      border: 1px solid #1f2a37;
      overflow: hidden;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: #10171f;
      border-bottom: 1px solid #1f2a37;
      flex-wrap: wrap;
      gap: 12px;
    }

    .pair-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pair-icon {
      background: #1e2a38;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f0b90b;
      font-weight: 700;
      font-size: 16px;
    }

    .pair-name {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.01em;
    }

    .pair-name span {
      font-size: 13px;
      font-weight: 500;
      color: #6b7b8f;
      margin-left: 8px;
    }

    .price-badge {
      display: flex;
      align-items: baseline;
      gap: 10px;
      background: #1a2330;
      padding: 6px 16px;
      border-radius: 24px;
      border: 1px solid #253141;
    }

    .price-badge .price {
      font-size: 20px;
      font-weight: 700;
    }

    .price-badge .change {
      font-size: 13px;
      font-weight: 600;
      color: #34c77b;
    }

    .chart-tabs {
      display: flex;
      gap: 6px;
      background: #1a2330;
      padding: 4px;
      border-radius: 14px;
    }

    .chart-tab {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 10px;
      color: #8b9bb0;
      cursor: pointer;
      transition: all 0.15s ease;
      background: transparent;
      border: none;
      font-family: inherit;
    }

    .chart-tab.active {
      background: #2962ff;
      color: white;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(41, 98, 255, 0.3);
    }

    .chart-area {
      padding: 12px 12px 0 12px;
    }

    #chartCanvas {
      width: 100%;
      height: 240px;
      display: block;
      border-radius: 12px;
      background: #10171f;
    }

    .market-stats {
      display: flex;
      justify-content: space-between;
      padding: 12px 18px 16px 18px;
      gap: 20px;
      flex-wrap: wrap;
      border-top: 1px solid #1a2330;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: #6b7b8f;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .stat-value {
      font-weight: 600;
      font-size: 15px;
    }

    .stat-value.up { color: #34c77b; }
    .stat-value.down { color: #f6465d; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      background: #10171f;
      border-bottom: 1px solid #1f2a37;
    }

    .card-header h3 {
      font-size: 15px;
      font-weight: 600;
    }

    .card-header .badge {
      background: #1e2a38;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      color: #8b9bb0;
      font-weight: 500;
    }

    .positions-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    .positions-table th {
      text-align: left;
      padding: 10px 18px;
      color: #6b7b8f;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      background: #0f151e;
      border-bottom: 1px solid #1f2a37;
    }

    .positions-table td {
      padding: 14px 18px;
      border-bottom: 1px solid #1a2330;
      font-weight: 500;
    }

    .positions-table tr:last-child td { border-bottom: none; }
    .positions-table .pair { font-weight: 600; color: white; }
    .positions-table .long { color: #34c77b; font-weight: 600; }
    .positions-table .short { color: #f6465d; font-weight: 600; }
    .pnl-up { color: #34c77b; font-weight: 600; }
    .pnl-down { color: #f6465d; font-weight: 600; }

    .action-btn {
      background: #1e2a38;
      border: none;
      color: #b0c4de;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .action-btn:hover {
      background: #2962ff;
      color: white;
    }

    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .order-tabs {
      display: flex;
      border-bottom: 1px solid #1f2a37;
      background: #10171f;
    }

    .order-tab {
      flex: 1;
      padding: 14px 0;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #6b7b8f;
      cursor: pointer;
      transition: 0.15s;
      border-bottom: 2px solid transparent;
      background: transparent;
      border: none;
      font-family: inherit;
    }

    .order-tab.active {
      color: #34c77b;
      border-bottom-color: #34c77b;
      background: #0f151e;
    }

    .order-tab.sell.active {
      color: #f6465d;
      border-bottom-color: #f6465d;
    }

    .order-form {
      padding: 20px 18px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 12px;
      color: #8b9bb0;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
    }

    .input-group label span {
      color: #b0c4de;
      font-weight: 600;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: #1a2330;
      border: 1px solid #253141;
      border-radius: 12px;
      padding: 0 14px;
      transition: border 0.15s;
    }

    .input-wrapper:focus-within {
      border-color: #2962ff;
      box-shadow: 0 0 0 3px rgba(41, 98, 255, 0.15);
    }

    .input-wrapper input {
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 0;
      width: 100%;
      font-family: inherit;
    }

    .input-wrapper input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
    }

    .input-wrapper .currency {
      color: #6b7b8f;
      font-weight: 500;
      font-size: 14px;
      margin-left: 6px;
    }

    .input-hint {
      font-size: 11px;
      color: #6b7b8f;
      margin-top: 2px;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }

    .slider-container input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      background: #253141;
      height: 4px;
      border-radius: 4px;
      outline: none;
    }

    .slider-container input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: #2962ff;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(41, 98, 255, 0.5);
      border: 2px solid white;
    }

    .slider-label {
      font-size: 12px;
      color: #b0c4de;
      font-weight: 600;
      min-width: 40px;
      text-align: right;
    }

    .order-summary {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #8b9bb0;
      border-top: 1px solid #1f2a37;
      padding-top: 14px;
      margin-top: 6px;
    }

    .order-summary .value {
      color: white;
      font-weight: 600;
    }

    .cta-button {
      background: #2962ff;
      border: none;
      color: white;
      font-weight: 600;
      font-size: 15px;
      padding: 16px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      box-shadow: 0 10px 20px -8px rgba(41, 98, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .cta-button:hover {
      background: #1e4bd8;
      transform: translateY(-1px);
      box-shadow: 0 14px 24px -8px rgba(41, 98, 255, 0.6);
    }

    .cta-button.sell {
      background: #f6465d;
      box-shadow: 0 10px 20px -8px rgba(246, 70, 93, 0.4);
    }

    .cta-button.sell:hover {
      background: #d93a4f;
    }

    .watchlist-items {
      padding: 4px 0 8px 0;
    }

    .watch-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid #1a2330;
      cursor: pointer;
      transition: background 0.1s;
    }

    .watch-item:last-child { border-bottom: none; }
    .watch-item:hover { background: #1a2330; }

    .watch-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .watch-icon {
      width: 32px;
      height: 32px;
      background: #1e2a38;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      color: #b0c4de;
    }

    .watch-name {
      font-weight: 600;
      font-size: 14px;
    }

    .watch-name span {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: #6b7b8f;
    }

    .watch-right { text-align: right; }
    .watch-price { font-weight: 600; font-size: 14px; }
    .watch-change { font-size: 12px; font-weight: 500; }
    .watch-change.up { color: #34c77b; }
    .watch-change.down { color: #f6465d; }

    /* ============================================================
       MODAL (Deposit / Withdraw)
       ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 12, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1500;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: #131a24;
      border: 1px solid #1f2a37;
      border-radius: 24px;
      width: 100%;
      max-width: 480px;
      padding: 28px;
      box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.9);
      transform: scale(0.95) translateY(10px);
      transition: transform 0.3s ease;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-overlay.open .modal-card {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      font-size: 20px;
      font-weight: 700;
    }

    .modal-close {
      background: #1a2330;
      border: none;
      color: #8b9bb0;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.15s;
      font-family: inherit;
    }

    .modal-close:hover {
      background: #253141;
      color: white;
    }

    .modal-tabs {
      display: flex;
      background: #1a2330;
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 22px;
    }

    .modal-tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #8b9bb0;
      background: transparent;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .modal-tab.active {
      background: #2962ff;
      color: white;
      box-shadow: 0 4px 12px rgba(41, 98, 255, 0.3);
    }

    .amount-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 14px 0 18px 0;
    }

    .preset-btn {
      background: #1a2330;
      border: 1px solid #253141;
      color: #b0c4de;
      padding: 10px 0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    .preset-btn:hover, .preset-btn.active {
      background: #2962ff;
      border-color: #2962ff;
      color: white;
    }

    .payment-methods {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .payment-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a2330;
      border: 1px solid #253141;
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .payment-option:hover {
      border-color: #2962ff;
    }

    .payment-option.selected {
      border-color: #2962ff;
      background: rgba(41, 98, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(41, 98, 255, 0.1);
    }

    .payment-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .payment-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #253141;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .payment-info .name {
      font-weight: 600;
      font-size: 14px;
    }

    .payment-info .desc {
      font-size: 12px;
      color: #6b7b8f;
    }

    .payment-radio {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #31465e;
      position: relative;
      transition: all 0.15s;
    }

    .payment-option.selected .payment-radio {
      border-color: #2962ff;
      background: #2962ff;
    }

    .payment-option.selected .payment-radio::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: white;
      transform: translate(-50%, -50%);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .modal-actions .cta-button {
      flex: 1;
    }

    /* ============================================================
       TOAST
       ============================================================ */
    .toast-message {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1f2a37;
      color: white;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 14px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8);
      border: 1px solid #31465e;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 3000;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toast-message.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast-message i { color: #34c77b; }
